name: Auto-run Jupyter Notebook

on:
  push:
    paths:
      - "**.ipynb"  # Run when any Jupyter Notebook is modified
  workflow_dispatch:  # Allows manual execution

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install jupyter nbconvert wandb numpy pandas scikit-learn opencv-python matplotlib

      - name: Run Jupyter Notebook
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}  # Optional, only if needed
        run: |
          jupyter nbconvert --to notebook --execute Lab_5_MLPR.ipynb --output output.ipynb

      - name: Commit and Push Updated Notebook
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add output.ipynb
          git commit -m "Auto-rerun Jupyter Notebook"
          git push
        continue-on-error: true
